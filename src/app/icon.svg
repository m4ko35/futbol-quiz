<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Futbol Challenge">
  <title>Futbol Challenge</title>
  <!--
    İki kesişen çember: uygulamanın tek sorusu olan "A ∩ B" kümesinin
    kendisi. Dolu mercek biçimi ortak oyuncuları temsil eder.

    ROZET BİÇİMİ: accent (mavi) yuvarlak kare zemin + beyaz işaret. Favicon
    tarayıcı arayüzünde çizilir ve sayfanın açık/koyu temasını devralmaz;
    zeminin kendisi kontrastı taşıdığı için işaret HEM açık HEM koyu sekme
    çubuğunda okunur. Renk artık markanın accent'iyle bir (#1d34d1) — eski
    yeşil, accent yeşilken kalmış bir izdi.
  -->
  <defs>
    <clipPath id="sol">
      <circle cx="13" cy="16" r="7" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="#1d34d1" />
  <circle cx="13" cy="16" r="7" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="19" cy="16" r="7" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="19" cy="16" r="7" fill="#ffffff" clip-path="url(#sol)" />
</svg>
