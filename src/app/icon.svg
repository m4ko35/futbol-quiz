<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Futbol Quiz">
  <title>Futbol Quiz</title>
  <!--
    İki kesişen çember: uygulamanın tek sorusu olan "A ∩ B" kümesinin
    kendisi. Dolu mercek biçimi ortak oyuncuları temsil eder.

    Renk sabit; favicon tarayıcı arayüzünde çizilir ve sayfanın açık/koyu
    temasını devralmaz. Bu yeşil hem beyaz hem koyu sekme çubuğunda okunur.
  -->
  <defs>
    <clipPath id="sol">
      <circle cx="12" cy="16" r="9" />
    </clipPath>
  </defs>
  <circle cx="12" cy="16" r="9" fill="none" stroke="#16a34a" stroke-width="2.5" />
  <circle cx="20" cy="16" r="9" fill="none" stroke="#16a34a" stroke-width="2.5" />
  <circle cx="20" cy="16" r="9" fill="#16a34a" clip-path="url(#sol)" />
</svg>
