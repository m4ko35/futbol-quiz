# Veri kapısı — PROJECT.md §3.1, §8.3.
#
# Veri kümesini Wikidata'dan yeniden üretir, KABUL KONTROLÜNDEN geçirir ve
# ancak geçerse yayımlar. `db:verify` bu iş akışının varlık sebebidir: bozuk
# veri, kullanıcıya ulaşmadan burada durur ve site bir önceki veriyle çalışmaya
# devam eder.
name: Veri tazeleme

on:
  schedule:
    # Yılda iki kez, transfer pencereleri kapandıktan BİRKAÇ HAFTA SONRA.
    # Kaynak Wikidata ve gönüllü katkısıyla güncelleniyor; pencere kapanır
    # kapanmaz koşmak, eksik bir anlık görüntüyü altı ay boyunca yayında
    # tutmak demek olurdu.
    - cron: "0 3 20 9 *" # 20 Eylül — yaz dönemi
    - cron: "0 3 20 2 *" # 20 Şubat — kış dönemi

  # Elle tetikleme: pencere takvimi kaydığında veya bir veri hatası
  # düzeltildiğinde beklemek gerekmesin.
  workflow_dispatch:
    inputs:
      resume:
        # SÜRDÜRME AÇIKÇA İSTENİR, olay türünden ÇIKARILMAZ (§8.3). Elle
        # tetikleme çoğu zaman TAZE veri içindir; önbellekten okumak o
        # durumda "tazeleme" diye eski yanıtları yeniden yazmak olurdu.
        # Öntanımlı `false` bu yüzden: unutulan bir seçenek veriyi
        # sessizce eskitmemeli (§7.11 ile aynı yön).
        description: "Yarıda kalan koşuyu önbellekten sürdür (TAZE VERİ ÇEKMEZ)"
        type: boolean
        default: false

permissions:
  contents: write # sürüm (release) varlığı yüklemek için

concurrency:
  group: data-refresh
  cancel-in-progress: false # yarıda kesilen ETL yarım veri bırakır

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ÖLÇÜLEN SÜRE, tahmin değil. İlk sürümde 180 yazıyordu ve gerekçesi
    # "ETL ~55 dakika" idi; ikisi de artık geçerli değil:
    #
    #   · Vikipedi katmanı (§4.3) ~1 saat ekliyor — ~1.760 istek
    #   · WDQS'in gecikmesi gün içinde dalgalanıyor; ölçülen bir koşuda
    #     oyuncu grubu başına ortalama 13,8 sn (tekil değerler 32 sn'ye çıktı)
    #
    # O koşu uçtan uca ~3,5 saat sürdü, yani 180 dakikalık sınır payı
    # tüketmekle kalmayıp aşıyordu. 330, GitHub'ın 360 dakikalık üst sınırının
    # altında kalarak yavaş bir güne yer bırakır.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run db:generate

      # Wikidata kimliksiz istemcileri ENGELLER; User-Agent bir iletişim
      # adresi içermek zorunda (scripts/etl/config.ts). Depo değişkeni
      # tanımlanmamışsa ETL 55 dakika sonra değil, burada dursun.
      - name: Ön denetim
        run: |
          if [ -z "${{ vars.ETL_USER_AGENT }}" ]; then
            echo "::error::ETL_USER_AGENT depo değişkeni tanımlı değil."
            echo "Settings → Secrets and variables → Actions → Variables"
            echo "Örnek: futbol-quiz/0.1.0 (https://github.com/KULLANICI/futbol-quiz; eposta@ornek.com)"
            exit 1
          fi

      # Şemayı migration'lardan kur. `migrate deploy` — `migrate dev` DEĞİL:
      # ikincisi etkileşimlidir ve gerektiğinde veritabanını sıfırlar.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./dev.db

      # ─── ÖNBELLEK ───────────────────────────────────────────────────────
      # Yarıda kalan bir koşu sıfırdan başlamasın (§8.3). Ölçüldü: ilk elle
      # koşu 68. dakikada düştü ve 262 başarılı grup çöpe gitti.
      #
      # GERİ YÜKLEME `resume` GİRDİSİNE BAĞLI, olay türüne değil. Zamanlanmış
      # koşu ve öntanımlı elle koşu TAZE veri çeker; önbellek yalnızca
      # açıkça istendiğinde okunur.
      - name: ETL önbelleğini geri yükle
        if: ${{ inputs.resume }}
        uses: actions/cache/restore@v4
        with:
          path: scripts/etl/.cache
          key: etl-cache-
          restore-keys: etl-cache-

      - name: ETL
        run: npm run etl
        env:
          DATABASE_URL: file:./dev.db
          # ETL'in zorunlu yapılandırması (scripts/etl/config.ts). Eksik
          # olanı Zod yakalar ve süreç başlamadan durur.
          ETL_USER_AGENT: ${{ vars.ETL_USER_AGENT }}
          WIKIDATA_SPARQL_ENDPOINT: https://query.wikidata.org/sparql
          # Wikidata'ya saniyede 1'den fazla istek atılmaz (§7.4).
          ETL_REQUESTS_PER_SECOND: "1"

      # BAŞARISIZLIKTA DA KAYDEDİLİR (`always()`) — önbelleğin bütün değeri
      # zaten budur: başarısız bir koşunun yarım önbelleği, bir sonraki
      # `resume` koşusunun sermayesidir.
      - name: ETL önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/etl/.cache
          key: etl-cache-${{ github.run_id }}

      # ─── KAPI ───────────────────────────────────────────────────────────
      # Buradan sonrası yalnızca kabul kontrolü geçerse çalışır. Zorunlu
      # kulüpler, bütünlük, kanıtsız dönem oranı ve bilinen çiftler (§8.2).
      - name: Kabul kontrolü
        run: npm run db:verify
        env:
          DATABASE_URL: file:./dev.db

      # Hız da bir kabul ölçütüdür (§1.4). Veri büyüdükçe sorgu yavaşlarsa
      # bunu kullanıcıdan önce burada görmek gerekir.
      - name: Performans ölçümü
        run: npm run bench
        env:
          DATABASE_URL: file:./dev.db

      # Boş alanları geri kazan: dosya dağıtım paketine giriyor ve orada her
      # megabayt sınıra karşı sayılıyor (§3.1).
      - name: Sıkıştır
        run: |
          sqlite3 prisma/dev.db "VACUUM;"
          ls -lh prisma/dev.db

      - name: Yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dataset-latest --yes --cleanup-tag || true
          gh release create dataset-latest prisma/dev.db \
            --title "Veri kümesi $(date -u +%Y-%m-%d)" \
            --notes "Wikidata'dan $(date -u +%Y-%m-%d) tarihinde üretildi; \
          db:verify ve bench kapılarından geçti."

      # Dağıtımı tetikle. Sır tanımlı değilse adım atlanır — böylece iş akışı
      # Vercel bağlanmadan önce de baştan sona çalıştırılıp denenebilir.
      - name: Dağıtımı tetikle
        if: ${{ vars.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ vars.VERCEL_DEPLOY_HOOK_URL }}"
