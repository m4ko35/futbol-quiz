# Kod kapısı — PROJECT.md §8.3.
#
# Her push ve her PR'da çalışır. Yayındaki bir siteye elle doğrulamayla
# güvenilemez: `npm run verify` yerelde unutulabilir, burada unutulamaz.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Aynı dal için üst üste gelen koşularda öncekini iptal et: eski bir commit'in
# sonucunu beklemek hem yavaş hem yanıltıcı.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      # `npm ci` — `npm install` DEĞİL. Kilit dosyasına birebir uyar; aksi
      # hâlde CI, geliştiricinin makinesinden farklı sürümleri test eder (§7.7).
      - run: npm ci

      # Prisma istemcisi üretilmiş kodda değil, kurulum sonrası üretilir
      # (`src/generated/` gitignore'da). Tip denetimi buna bağlı.
      - run: npm run db:generate

      # İKİ İSTEMCİ VAR, İKİSİ DE ÜRETİLMELİ (§11.3). Bu satır 17 Ağustos
      # 2026'dan 20 Ağustos'a kadar EKSİKTİ ve CI o süre boyunca her push'ta
      # düştü: `tsc` "Cannot find module '@/generated/prisma-accounts'"
      # diyordu. Kapı kırıkken kimse kapıya bakmadığı için fark edilmesi
      # üç gün aldı.
      #
      # AYNI KUSURUN İKİNCİ KEZ YAŞANMASI: `vercel-build` de bir süre bu
      # istemciyi üretmiyordu ve üretim dağıtımı "Module not found" ile
      # düşmüştü (16 Ağustos, prisma/accounts.schema.prisma başındaki not).
      # Orada düzeltildi, buraya taşınmadı. Sebep ikisinde de aynı:
      # `src/generated/` .gitignore'da olduğu için klasör geliştiricinin
      # diskinde DURUYOR — yerel `npm run verify` geçiyor, temiz bir çıkış
      # alan her ortam düşüyor.
      #
      # ORTAM DEĞİŞKENİ GEREKMİYOR ve bu ölçüldü: hesap şemasının datasource
      # adresi `env()` değil, sabit bir yer tutucu; üretim bağlantı kurmuyor.
      - run: npm run db:generate:accounts

      # Testler geçici veritabanlarını migration'lardan kurar; şema dosyası
      # yeterli, veri gerekmez.
      - run: npm run verify
        env:
          DATABASE_URL: file:./dev.db
          RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
          RATE_LIMIT_BURST: "10"
          TRUSTED_PROXY_HOPS: "1"

      # Üretim ağacında yüksek/kritik açık sıfır olmalı (§7.7). Ayrı adım:
      # başarısız olduğunda hangi kapının kapandığı log'dan tek bakışta okunur.
      - run: npm run audit:ci
